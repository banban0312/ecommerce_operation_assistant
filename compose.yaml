name: ecommerce-operation-assistant

# API 与 Worker 共用同一组数据库、队列、存储和日志配置。
x-api-environment: &api-environment
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce}
  MYSQL_USER: ${MYSQL_USER:-ecommerce}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/init-env.ps1 first}
  AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Run scripts/init-env.ps1 first}
  AUTH_TOKEN_EXPIRE_MINUTES: ${AUTH_TOKEN_EXPIRE_MINUTES:-60}
  REDIS_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  UPLOADS_DIR: /app/uploads
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # 密钥仅进入 API/Worker 运行环境，不保存到业务数据库或浏览器响应。
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-}
  OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-}
  VIDEO_PROVIDER: ${VIDEO_PROVIDER:-}
  VIDEO_API_KEY: ${VIDEO_API_KEY:-}
  VIDEO_MODEL: ${VIDEO_MODEL:-}

# API 与 Worker 共用镜像，迁移容器也使用该镜像执行 Alembic。
x-api-build: &api-build
  build: ./api
  image: ecommerce-operation-api:local

services:
  mysql:
    # 数据库只暴露给 Compose 内部网络，数据保存在命名卷中。
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce}
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/init-env.ps1 first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/init-env.ps1 first}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  redis:
    # Redis 同时承载 Celery 消息队列和结果存储，启用 AOF 持久化。
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    # 应用启动前先执行迁移；失败时 API 和 Worker 不会启动。
    <<: *api-build
    environment: *api-environment
    command: [alembic, upgrade, head]
    depends_on:
      mysql:
        condition: service_healthy

  api:
    # FastAPI 仅绑定本机回环地址，供本机开发访问。
    <<: *api-build
    environment: *api-environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    # 后台任务进程与 API 共用代码及素材卷，但独立消费队列。
    <<: *api-build
    environment: *api-environment
    command: [celery, -A, app.worker.celery_app:celery_app, worker, --loglevel=INFO, --concurrency=2, --hostname=worker@%h]
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'celery -A app.worker.celery_app:celery_app inspect ping --destination="worker@$$HOSTNAME" --timeout=5']
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    # Next.js 负责浏览器页面，并通过服务端访问内部 API。
    build: ./web
    image: ecommerce-operation-web:local
    environment:
      API_INTERNAL_URL: http://api:8000
      API_PUBLIC_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  # 命名卷分别保存数据库、Redis 和上传素材，容器重建时仍可保留。
  mysql_data:
  redis_data:
  uploads_data:
