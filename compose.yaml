name: ecommerce-operation-assistant

x-api-environment: &api-environment
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce}
  MYSQL_USER: ${MYSQL_USER:-ecommerce}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/init-env.ps1 first}
  REDIS_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  UPLOADS_DIR: /app/uploads
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-api-build: &api-build
  build: ./api
  image: ecommerce-operation-api:local

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce}
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/init-env.ps1 first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/init-env.ps1 first}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *api-build
    environment: *api-environment
    command: [alembic, upgrade, head]
    depends_on:
      mysql:
        condition: service_healthy

  api:
    <<: *api-build
    environment: *api-environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *api-build
    environment: *api-environment
    command: [celery, -A, app.worker.celery_app:celery_app, worker, --loglevel=INFO, --concurrency=2, --hostname=worker@%h]
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'celery -A app.worker.celery_app:celery_app inspect ping --destination="worker@$$HOSTNAME" --timeout=5']
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build: ./web
    image: ecommerce-operation-web:local
    environment:
      API_INTERNAL_URL: http://api:8000
      API_PUBLIC_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  uploads_data:
