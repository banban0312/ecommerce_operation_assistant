[project]
# 项目元数据和运行依赖由 uv 读取，具体解析版本记录在 uv.lock。
name = "ecommerce-operation-api"
version = "0.1.0"
description = "API and worker for the ecommerce operation assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2,<3",
    "SQLAlchemy>=2,<3",
    "alembic>=1.13,<2",
    "PyMySQL[rsa]>=1.1,<2",
    "redis>=5,<8",
    "celery[redis]>=5.4,<6",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "openpyxl>=3.1,<4",
]

[dependency-groups]
# 开发依赖仅供本地检查和测试使用，不进入生产容器。
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
